name: Static compatibility

on:
  workflow_dispatch:
    inputs:
      minecraft_series:
        description: Minecraft release line to inspect
        required: false
        default: '26.2'
        type: string
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  create-fly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Check Create Fly Mixin hooks
        run: ./scripts/check-create-fly-compatibility.sh "${{ inputs.minecraft_series || '26.2' }}"
      - name: Publish report to workflow summary
        run: cat build/compatibility/*.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: create-fly-static-compatibility
          path: build/compatibility/*.md
          if-no-files-found: error
